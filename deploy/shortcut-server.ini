; supervisor 配置 — 放置到 /etc/supervisor/conf.d/shortcut-server.conf
; 然后 supervisorctl reread && supervisorctl update

[program:shortcut-server]
command=/usr/bin/gunicorn -w 1 -b 127.0.0.1:5000 server:app
directory=/root/shortcut-server
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/shortcut-server/stdout.log
stderr_logfile=/var/log/shortcut-server/stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=PATH="/usr/bin:/usr/local/bin"
